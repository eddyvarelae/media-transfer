  <path d="M383.41 100 L640.59 100 C722.19 100 763 100 799.79 112.14 L806.92 113.89 C854.88 131.34 892.66 169.12 910.11 217.08 C924 261 924 301.81 924 383.41 L924 640.59 C924 722.19 924 763 911.86 799.79 L910.11 806.92 C892.66 854.88 854.88 892.66 806.92 910.11 C763 924 722.19 924 640.59 924 L383.41 924 C301.81 924 261 924 224.21 911.86 L217.08 910.11 C169.12 892.66 131.34 854.88 113.89 806.92 C100 763 100 722.19 100 640.59 L100 383.41 C100 301.81 100 261 112.14 224.21 L113.89 217.08 C131.34 169.12 169.12 131.34 217.08 113.89 C261 100 301.81 100 383.41 100 Z" fill="#F5F9FF"/>
  <g clip-path="url(#tile)">
    <!-- SD card: 45 deg chamfer (the DP slope), outline at the DP letter-stem ratio (~1/6 of height), square miter corners -->
    <path d="M412 204 L554.06 204 L612 261.94 L612 444 L412 444 Z" fill="none" stroke="#182D52" stroke-width="48" stroke-linejoin="miter"/>
    <rect x="456" y="258" width="22" height="56" fill="#182D52"/>
    <rect x="496" y="258" width="22" height="56" fill="#182D52"/>
    <rect x="536" y="258" width="22" height="56" fill="#182D52"/>
    <!-- The media on the card is the Digital Porters mark itself (exact polygon), standing on the card's edge -->
    <path transform="matrix(0.742 0 0 0.742 437.6116 317.1159)" d="M58.5 97L14 140H186.5L183 132.5L170 127L160 114L144 119.5L135 97L100 60L76 80.5V86L67 100.5L58.5 97Z" fill="#182D52"/>
    <!-- Transfer arrow, same monoline weight, in the app accent -->
    <path d="M512 496 V630.06 M454 572.06 L512 630.06 L570 572.06" fill="none" stroke="#4F8CFF" stroke-width="48" stroke-linecap="butt" stroke-linejoin="miter"/>
    <!-- Drive: same outline, slot line and activity light -->
    <rect x="280" y="716" width="464" height="104" fill="none" stroke="#182D52" stroke-width="48"/>
    <rect x="336" y="758" width="150" height="20" fill="#182D52"/>
    <rect x="644" y="746" width="44" height="44" fill="#4F8CFF"/>
  </g>
</svg>
